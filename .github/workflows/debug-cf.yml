name: Debug CF Token

on:
  push:
    branches:
      - debug/cf-token
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Diagnose token
        run: |
          set -e
          LEN=${#CLOUDFLARE_API_TOKEN}
          HASH=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "Secret length: $LEN (expected 53)"
          echo "Secret sha256: $HASH"
          echo "Expected sha256: e04f03cbc7d57318fba275568a85cc7b6e533f5d796f5518f4095a50fb38ca6a"
          echo "hash check done"
